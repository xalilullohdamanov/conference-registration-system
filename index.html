<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Konferensiya Boshqaruv Paneli</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    .iframe-container {
      position: relative;
      width: 100%;
      height: 85vh;
      border-radius: 1rem;
      overflow: hidden;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body class="bg-slate-100 min-h-screen p-4 md:p-6">

  <div class="max-w-7xl mx-auto space-y-4">
    
    <!-- Top Header & Action Bar -->
    <div class="bg-indigo-700 text-white p-5 rounded-2xl shadow-lg flex flex-col md:flex-row justify-between items-center gap-4">
      <div>
        <h1 class="text-2xl md:text-3xl font-bold">Talabalarning Ilmiy-Amaliy Konferensiyasi</h1>
        <p class="text-indigo-200 text-sm mt-1">Ro'yxatdan o'tkazish, Sheets va GitHub API sinxronizatsiyasi</p>
      </div>
      <a href="https://script.google.com/macros/s/AKfycbzMY0tzzkuXtq18TqdzQZtAY--4M3htWCO7GEiiUHJZ_qe42W92tid6Hv4RA3PkuZPK/exec" 
         target="_blank" 
         class="bg-white text-indigo-700 hover:bg-indigo-50 font-bold px-5 py-2.5 rounded-xl shadow transition flex items-center gap-2 whitespace-nowrap text-sm">
        <span>Tizimni alohida oynada ochish</span>
        <i class="fa-solid fa-up-right-from-square"></i>
      </a>
    </div>

    <!-- Web Application Frame -->
    <div class="iframe-container bg-white border border-gray-200">
      <iframe 
        src="https://script.google.com/macros/s/AKfycbzMY0tzzkuXtq18TqdzQZtAY--4M3htWCO7GEiiUHJZ_qe42W92tid6Hv4RA3PkuZPK/exec" 
        allow="geolocation; microphone; camera">
      </iframe>
    </div>

  </div>

</body>
</html>
