<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <title>Ro'yxatdan O'tish</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-6 flex justify-center">
  <div class="max-w-md w-full bg-white rounded-xl shadow-md p-6 space-y-4">
    <h2 class="text-xl font-bold text-center text-indigo-600">Konferensiya Ro'yxatdan O'tish</h2>
    
    <div id="alert" class="hidden p-3 rounded text-sm"></div>

    <form onsubmit="saveData(event)" class="space-y-3">
      <div>
        <label class="block text-sm font-medium">F.I.Sh.:</label>
        <input type="text" id="fullname" required class="w-full border p-2 rounded">
      </div>
      <div>
        <label class="block text-sm font-medium">Guruh / Kurs:</label>
        <input type="text" id="group" required class="w-full border p-2 rounded">
      </div>
      <div>
        <label class="block text-sm font-medium">Yo'nalishi:</label>
        <select id="direction" required class="w-full border p-2 rounded">
          <option value="">Yuklanmoqda...</option>
        </select>
      </div>
      <div>
        <label class="block text-sm font-medium">E-pochta:</label>
        <input type="email" id="email" required class="w-full border p-2 rounded">
      </div>
      <div>
        <label class="block text-sm font-medium">Telefon:</label>
        <input type="text" id="phone" required class="w-full border p-2 rounded">
      </div>
      <div>
        <label class="block text-sm font-medium">Ma'ruza mavzusi:</label>
        <textarea id="topic" required class="w-full border p-2 rounded"></textarea>
      </div>
      <button type="submit" id="btn" class="w-full bg-indigo-600 text-white py-2 rounded font-semibold">Saqlash</button>
    </form>
  </div>

  <script>
    window.onload = function() {
      google.script.run.withSuccessHandler(function(dirs) {
        let select = document.getElementById('direction');
        select.innerHTML = '<option value="">-- Tanlang --</option>';
        dirs.forEach(d => select.innerHTML += `<option value="${d}">${d}</option>`);
      }).getDirections();
    };

    function saveData(e) {
      e.preventDefault();
      document.getElementById('btn').disabled = true;
      let data = {
        fullname: document.getElementById('fullname').value,
        group: document.getElementById('group').value,
        direction: document.getElementById('direction').value,
        email: document.getElementById('email').value,
        phone: document.getElementById('phone').value,
        topic: document.getElementById('topic').value
      };
      google.script.run.withSuccessHandler(function(res) {
        document.getElementById('btn').disabled = false;
        let alert = document.getElementById('alert');
        alert.classList.remove('hidden');
        alert.innerText = res.message;
        alert.className = res.success ? 'p-3 bg-green-100 text-green-700 rounded' : 'p-3 bg-red-100 text-red-700 rounded';
      }).addParticipant(data);
    }
  </script>
</body>
</html>
